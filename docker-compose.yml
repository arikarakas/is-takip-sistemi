services:
  db:
    image: postgres:16-alpine
    container_name: is_takip_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - is_takip_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: is_takip_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app:cached
      - ./backend/alembic:/app/alembic:cached
      - ./backend/alembic.ini:/app/alembic.ini:cached
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
      --proxy-headers
      --forwarded-allow-ips=172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
    depends_on:
      db:
        condition: service_healthy
    networks:
      - is_takip_network
    
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: is_takip_frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-/api/v1}
      VITE_DEV_PROXY_TARGET: http://backend:8000
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - is_takip_network
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: is_takip_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - is_takip_network

volumes:
  postgres_data:

networks:
  is_takip_network:
    driver: bridge
